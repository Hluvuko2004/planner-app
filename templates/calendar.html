{% extends "layout.html" %}

{% block title %}Event Calendar{% endblock %}

{% block content %}
<div class="tasks-page-header">
    <div>
        <h1>📅 Interactive Calendar</h1>
        <p class="text-muted">View and manage your upcoming events and schedule.</p>
    </div>
</div>

<!-- Event Creation Form Card -->
<div class="card-box">
    <h3 class="form-title">+ Schedule New Event</h3>
    <form action="/events/add" method="POST" class="task-form">
        <input type="text" name="title" placeholder="Event title..." required class="form-input flex-2">
        <input type="text" name="description" placeholder="Description..." class="form-input flex-3">
        <div style="flex: 2; display: flex; gap: 5px; align-items: center;">
            <label style="font-size: 0.8rem; color: #64748b;">Start:</label>
            <input type="datetime-local" name="start_time" required class="form-input" style="width: 100%;">
        </div>
        <div style="flex: 2; display: flex; gap: 5px; align-items: center;">
            <label style="font-size: 0.8rem; color: #64748b;">End:</label>
            <input type="datetime-local" name="end_time" required class="form-input" style="width: 100%;">
        </div>
        <button type="submit" class="btn-submit">Add Event</button>
    </form>
</div>

<!-- FullCalendar Container -->
<div class="card-box" style="background: white;">
    <div id="calendar" style="min-height: 600px;"></div>
</div>
{% endblock %}

{% block scripts %}
<!-- FullCalendar CSS & JS CDNs -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '/api/events', // Fetches directly from our Flask backend API endpoint
        height: 650
    });
    calendar.render();
});
</script>
{% endblock %}
