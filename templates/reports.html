{% extends "layout.html" %}

{% block title %}Reports & Analytics{% endblock %}

{% block content %}
<div class="tasks-page-header">
    <div>
        <h1>📊 Productivity Reports</h1>
        <p class="text-muted">Analyze your task completion trends and workload distribution.</p>
    </div>
</div>

<!-- Analytics Charts Grid with data passed safely via data attributes -->
<div class="reports-grid" 
     id="reportData"
     data-todo="{{ status_data.todo }}"
     data-inprogress="{{ status_data.in_progress }}"
     data-completed="{{ status_data.completed }}"
     data-low="{{ priority_data.Low }}"
     data-medium="{{ priority_data.Medium }}"
     data-high="{{ priority_data.High }}">
    
    <!-- Chart 1: Task Status Breakdown -->
    <div class="card-box chart-card">
        <h3 class="chart-title">Task Status Distribution</h3>
        <div class="chart-container">
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <!-- Chart 2: Priority Breakdown -->
    <div class="card-box chart-card">
        <h3 class="chart-title">Workload by Priority</h3>
        <div class="chart-container">
            <canvas id="priorityChart"></canvas>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Read the safe data attributes instead of raw Jinja injection inside JS
    const dataContainer = document.getElementById('reportData');
    const todoCount = parseInt(dataContainer.dataset.todo) || 0;
    const inProgressCount = parseInt(dataContainer.dataset.inprogress) || 0;
    const completedCount = parseInt(dataContainer.dataset.completed) || 0;
    
    const lowCount = parseInt(dataContainer.dataset.low) || 0;
    const mediumCount = parseInt(dataContainer.dataset.medium) || 0;
    const highCount = parseInt(dataContainer.dataset.high) || 0;

    // 1. Task Status Doughnut Chart
    const statusCtx = document.getElementById('statusChart').getContext('2d');
    new Chart(statusCtx, {
        type: 'doughnut',
        data: {
            labels: ['To Do', 'In Progress', 'Completed'],
            datasets: [{
                data: [todoCount, inProgressCount, completedCount],
                backgroundColor: ['#dc2626', '#d97706', '#16a34a'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    // 2. Priority Bar Chart
    const priorityCtx = document.getElementById('priorityChart').getContext('2d');
    new Chart(priorityCtx, {
        type: 'bar',
        data: {
            labels: ['Low', 'Medium', 'High'],
            datasets: [{
                label: 'Tasks Count',
                data: [lowCount, mediumCount, highCount],
                backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
});
</script>
{% endblock %}
