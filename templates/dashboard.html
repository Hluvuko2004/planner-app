{% extends "layout.html" %}

{% block title %}Dashboard Overview{% endblock %}

{% block content %}
<div class="dashboard-header" style="margin-bottom: 25px;">
    <h1>Welcome back, {{ username }}! 👋</h1>
    <p style="color: #64748b; margin-top: 5px;">Here is an overview of today's schedule and tasks.</p>
</div>

<!-- Overview Metric Cards (Fully responsive: stacks on mobile/half-screen, 4-col on desktop) -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
    <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        <span style="font-size: 0.8rem; color: #64748b; font-weight: 600;">TODAY'S TASKS</span>
        <h2 style="font-size: 1.8rem; margin-top: 8px;">0</h2>
    </div>
    <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        <span style="font-size: 0.8rem; color: #64748b; font-weight: 600;">UPCOMING EVENTS</span>
        <h2 style="font-size: 1.8rem; margin-top: 8px; color: #2563eb;">0</h2>
    </div>
    <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        <span style="font-size: 0.8rem; color: #64748b; font-weight: 600;">HIGH PRIORITY</span>
        <h2 style="font-size: 1.8rem; margin-top: 8px; color: #dc2626;">0</h2>
    </div>
    <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        <span style="font-size: 0.8rem; color: #64748b; font-weight: 600;">COMPLETED THIS WEEK</span>
        <h2 style="font-size: 1.8rem; margin-top: 8px; color: #16a34a;">0</h2>
    </div>
</div>
{% endblock %}
